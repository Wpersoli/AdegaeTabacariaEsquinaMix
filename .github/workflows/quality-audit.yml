name: Quality audit

'on':
  push:
    branches:
      - 'quality/**'
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'vercel.json'
      - '.github/workflows/quality-audit.yml'

concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install browser test and Lighthouse tools
        run: npm install --no-save playwright@1.54.2 lighthouse@12.8.2

      - name: Validate application JavaScript syntax
        run: node --check app.js

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Vercel-like compressed static server
        run: |
          cat > /tmp/esquina-server.mjs <<'NODE'
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { resolve, sep, extname } from 'node:path';
          import { brotliCompressSync, gzipSync, constants } from 'node:zlib';

          const root = process.cwd();
          const mime = {
            '.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8',
            '.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8',
            '.xml':'application/xml; charset=utf-8','.txt':'text/plain; charset=utf-8',
            '.webp':'image/webp','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg',
            '.ico':'image/x-icon','.svg':'image/svg+xml'
          };
          const compressible = /^(text\/|application\/(javascript|json|xml|xml\+|manifest\+)|image\/svg\+xml)/;
          createServer(async (req,res) => {
            try {
              const requestPath = decodeURIComponent(new URL(req.url,'http://localhost').pathname);
              const relative = requestPath === '/' ? 'index.html' : requestPath.replace(/^\/+/, '');
              const filePath = resolve(root,relative);
              if (filePath !== root && !filePath.startsWith(root + sep)) {
                res.writeHead(403); res.end('Forbidden'); return;
              }
              let body = await readFile(filePath);
              const type = mime[extname(filePath).toLowerCase()] || 'application/octet-stream';
              const headers = {'Content-Type':type,'X-Content-Type-Options':'nosniff'};
              if (requestPath.startsWith('/assets/')) headers['Cache-Control']='public, max-age=86400, stale-while-revalidate=604800';
              else headers['Cache-Control']='public, max-age=0, must-revalidate';
              if (compressible.test(type)) {
                const accept = req.headers['accept-encoding'] || '';
                if (/\bbr\b/.test(accept)) {
                  body = brotliCompressSync(body,{params:{[constants.BROTLI_PARAM_QUALITY]:4}});
                  headers['Content-Encoding']='br';
                  headers['Vary']='Accept-Encoding';
                } else if (/\bgzip\b/.test(accept)) {
                  body = gzipSync(body,{level:6});
                  headers['Content-Encoding']='gzip';
                  headers['Vary']='Accept-Encoding';
                }
              }
              headers['Content-Length']=String(body.length);
              res.writeHead(200,headers);
              res.end(req.method === 'HEAD' ? undefined : body);
            } catch(error) {
              res.writeHead(error.code === 'ENOENT' ? 404 : 500,{'Content-Type':'text/plain; charset=utf-8'});
              res.end(error.code === 'ENOENT' ? 'Not found' : 'Server error');
            }
          }).listen(4173,'127.0.0.1');
          NODE
          node /tmp/esquina-server.mjs > /tmp/esquina-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/esquina-http.log
          exit 1

      - name: Run Chromium, Firefox and WebKit smoke tests
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium, firefox, webkit } from 'playwright';

          const engines = [
            ['Chromium', chromium],
            ['Firefox', firefox],
            ['WebKit', webkit]
          ];
          const viewports = [320, 360, 390, 430, 768, 1024, 1365];
          const report = [];

          for (const [name, engine] of engines) {
            const browser = await engine.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 1365, height: 900 } });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              await page.addInitScript(() => {
                window.__esquinaOutboundUrl = null;
                window.open = url => {
                  window.__esquinaOutboundUrl = String(url);
                  return { opener: null };
                };
              });

              const response = await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });
              assert.equal(response?.status(), 200, name + ': homepage must return HTTP 200');
              await page.waitForSelector('#yes', { timeout: 15000 });
              await page.locator('#yes').click();
              await page.waitForSelector('.prod-card', { timeout: 15000 });
              await page.waitForFunction(() => document.querySelectorAll('.prod-card').length === 39, null, { timeout: 15000 });
              await page.emulateMedia({ reducedMotion: 'reduce' });
              const reducedMotion = await page.evaluate(() => ({
                marquee: getComputedStyle(document.querySelector('.mq-t')).animationName,
                brandMarquee: getComputedStyle(document.querySelector('.fleet__t')).animationName,
                floatingPulse: getComputedStyle(document.querySelector('#waFab'), '::after').animationName,
                smoothScroll: getComputedStyle(document.documentElement).scrollBehavior
              }));
              assert.equal(reducedMotion.marquee, 'none', name + ': marquee must stop for reduced motion');
              assert.equal(reducedMotion.brandMarquee, 'none', name + ': brand marquee must stop for reduced motion');
              assert.equal(reducedMotion.floatingPulse, 'none', name + ': WhatsApp pulse must stop for reduced motion');
              assert.equal(reducedMotion.smoothScroll, 'auto', name + ': smooth scroll must stop for reduced motion');
              await page.emulateMedia({ reducedMotion: 'no-preference' });
              const animatedBrandLogos = await page.evaluate(() => {
                const logo = document.querySelector('.fleet__i');
                return {
                  track: getComputedStyle(document.querySelector('.fleet__t')).animationName,
                  float: getComputedStyle(logo).animationName,
                  shine: getComputedStyle(logo, '::after').animationName
                };
              });
              assert.equal(animatedBrandLogos.track, 'mq', name + ': brand marquee must move');
              assert.equal(animatedBrandLogos.float, 'fleetFloat', name + ': brand logos must orbit vertically');
              assert.equal(animatedBrandLogos.shine, 'fleetShine', name + ': brand logos must retain the moving highlight');
              await page.evaluate(() => {
                document.documentElement.style.scrollBehavior='auto';
                window.scrollTo({ top: document.documentElement.scrollHeight, left: 0, behavior: 'instant' });
              });
              await page.waitForFunction(() =>
                document.querySelector('.mq')?.classList.contains('is-offscreen') &&
                document.querySelector('.hero')?.classList.contains('is-offscreen'),
                null,
                { timeout: 3000 }
              ).catch(async () => {
                const state = await page.evaluate(() => ({
                  scrollY: window.scrollY,
                  pageHeight: document.documentElement.scrollHeight,
                  tickerTop: document.querySelector('.mq')?.getBoundingClientRect().top,
                  heroTop: document.querySelector('.hero')?.getBoundingClientRect().top,
                  tickerClass: document.querySelector('.mq')?.className,
                  heroClass: document.querySelector('.hero')?.className
                }));
                throw new Error(name + ': offscreen observer did not settle: ' + JSON.stringify(state));
              });
              const offscreenPaused = await page.evaluate(() => ({
                ticker: document.querySelector('.mq')?.classList.contains('is-offscreen') ?? false,
                hero: document.querySelector('.hero')?.classList.contains('is-offscreen') ?? false
              }));
              assert.equal(offscreenPaused.ticker, true, name + ': ticker should pause when outside viewport');
              assert.equal(offscreenPaused.hero, true, name + ': hero effects should pause when outside viewport');
              const pausedAnimationState = await page.evaluate(() => ({
                ticker: getComputedStyle(document.querySelector('.mq-t')).animationPlayState,
                hero: getComputedStyle(document.querySelector('.hero img')).animationPlayState
              }));
              assert.equal(pausedAnimationState.ticker, 'paused', name + ': offscreen ticker animation must be paused');
              assert.equal(pausedAnimationState.hero, 'paused', name + ': offscreen hero animation must be paused');
              await page.evaluate(() => {
                document.documentElement.style.scrollBehavior='auto';
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
              });
              await page.waitForFunction(() => !document.querySelector('.hero')?.classList.contains('is-offscreen'), null, { timeout: 3000 })
                .catch(async () => {
                  const state = await page.evaluate(() => ({
                    scrollY: window.scrollY,
                    heroTop: document.querySelector('.hero')?.getBoundingClientRect().top,
                    className: document.querySelector('.hero')?.className
                  }));
                  throw new Error(name + ': hero did not resume after scrolling to top: ' + JSON.stringify(state));
                });

              await page.locator('img').evaluateAll(images => images.forEach(image => { image.loading = 'eager'; }));
              await page.waitForTimeout(1500);
              const brokenImages = await page.locator('img').evaluateAll(images =>
                images.filter(image => image.complete && image.naturalWidth === 0)
                  .map(image => image.currentSrc || image.src)
              );
              assert.equal(brokenImages.length, 0, name + ': no broken images');

              const responsive = [];
              for (const width of viewports) {
                await page.setViewportSize({ width, height: 900 });
                await page.waitForTimeout(100);
                if (width <= 700) {
                  const mobileMotion = await page.evaluate(() => ({
                    hero: getComputedStyle(document.querySelector('.hero img')).animationName,
                    shine: getComputedStyle(document.querySelector('.hero'), '::after').display,
                    cta: getComputedStyle(document.querySelector('.hero-cta')).animationName,
                    statusDot: getComputedStyle(document.querySelector('.dot')).animationName,
                    whatsappPulse: getComputedStyle(document.querySelector('#waFab'), '::after').animationName,
                    marqueeDuration: getComputedStyle(document.querySelector('.mq-t')).animationDuration,
                    brandDuration: getComputedStyle(document.querySelector('.fleet__t')).animationDuration,
                    brandFloat: getComputedStyle(document.querySelector('.fleet__i')).animationName,
                    brandShine: getComputedStyle(document.querySelector('.fleet__i'), '::after').animationName
                  }));
                  assert.equal(mobileMotion.hero, 'none', name + ': hero zoom must be disabled on touch-sized viewports');
                  assert.equal(mobileMotion.shine, 'none', name + ': hero shine overlay must be disabled on touch-sized viewports');
                  assert.equal(mobileMotion.cta, 'none', name + ': CTA pulse must be disabled on touch-sized viewports');
                  assert.equal(mobileMotion.statusDot, 'none', name + ': status blink must be disabled on touch-sized viewports');
                  assert.equal(mobileMotion.whatsappPulse, 'none', name + ': floating pulse must be disabled on touch-sized viewports');
                  assert.match(mobileMotion.marqueeDuration, /^(68|[7-9][0-9])s$/, name + ': mobile ticker should keep a slow continuous cadence');
                  assert.match(mobileMotion.brandDuration, /^(68|[7-9][0-9])s$/, name + ': mobile brand strip should keep a slow continuous cadence');
                  assert.equal(mobileMotion.brandFloat, 'fleetFloat', name + ': brand orbit must remain enabled on touch screens');
                  assert.equal(mobileMotion.brandShine, 'fleetShine', name + ': brand shine must remain enabled on touch screens');
                }
                const result = await page.evaluate(() => {
                  const selectors = [
                    '.top', '.brand', '.search', '.actions', '.nav', '.nav button', '.hero',
                    '.feat__head', '.feat__grid', '.prod-card',
                    '.loc2__inner', '.loc2__card', '.loc2__map', 'footer', '.ft'
                  ];
                  const overflow = [];
                  for (const selector of selectors) {
                    for (const element of document.querySelectorAll(selector)) {
                      const rect = element.getBoundingClientRect();
                      if (rect.width > 0 && (rect.left < -1 || rect.right > innerWidth + 1)) {
                        overflow.push({ selector, left: Math.round(rect.left), right: Math.round(rect.right) });
                      }
                    }
                  }
                  const nav=document.querySelector('#nav');
                  const navRect=nav.getBoundingClientRect();
                  const navButtons=[...nav.querySelectorAll('button')];
                  const navLayout={
                    count:navButtons.length,
                    scrollWidth:nav.scrollWidth,
                    clientWidth:nav.clientWidth,
                    buttonsInside:navButtons.every(button=>{
                      const r=button.getBoundingClientRect();
                      return r.left>=navRect.left-1 && r.right<=navRect.right+1;
                    })
                  };
                  return {
                    width: innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    bodyWidth: document.body.scrollWidth,
                    navLayout,
                    overflow
                  };
                });
                assert.equal(result.overflow.length, 0, name + ': key layout elements must fit at ' + width + 'px: ' + JSON.stringify(result.overflow));
                assert.equal(result.navLayout.count, 7, name + ': all seven category links must render');
                assert.ok(result.navLayout.scrollWidth <= result.navLayout.clientWidth + 1, name + ': category menu must not clip or scroll sideways');
                assert.equal(result.navLayout.buttonsInside, true, name + ': every category button must remain aligned inside the menu');
                responsive.push(result);
              }

              await page.setViewportSize({ width: 1365, height: 900 });
              await page.locator('.prod-buy').first().click();
              assert.equal((await page.locator('#badge').textContent()).trim(), '1', name + ': product should enter cart');
              await page.locator('#cartBtn').click();
              assert.equal(await page.locator('#send').isDisabled(), false, name + ': checkout should enable with cart items');
              await page.locator('#send').click();
              const outbound = await page.evaluate(() => window.__esquinaOutboundUrl);
              assert.match(outbound || '', /^https:\/\/wa\.me\/5511917221039\?text=/, name + ': order should build the expected WhatsApp URL');

              assert.equal(pageErrors.length, 0, name + ': no uncaught JavaScript errors: ' + pageErrors.join(' | '));
              report.push({
                browser: name,
                version: browser.version(),
                status: 'passed',
                responsive,
                brokenImages,
                pageErrors,
                whatsappUrlBuilt: true
              });
              await page.screenshot({ path: 'artifacts/' + name.toLowerCase() + '-mobile.png', fullPage: true });
              await context.close();
            } finally {
              await browser.close();
            }
          }

          await import('node:fs/promises').then(fs => fs.writeFile(
            'artifacts/cross-browser-smoke.json',
            JSON.stringify(report, null, 2)
          ));
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Run Lighthouse mobile and desktop audits
        run: |
          mkdir -p artifacts/lighthouse
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:4173/ \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=artifacts/lighthouse/mobile.json --quiet
          npx lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=artifacts/lighthouse/desktop.json --quiet
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const device of ['mobile', 'desktop']) {
            const report = JSON.parse(fs.readFileSync('artifacts/lighthouse/' + device + '.json', 'utf8'));
            const scores = Object.fromEntries(
              Object.entries(report.categories).map(([key, value]) => [key, Math.round(value.score * 100)])
            );
            const metrics = Object.fromEntries(
              ['first-contentful-paint', 'largest-contentful-paint', 'total-blocking-time', 'cumulative-layout-shift', 'speed-index']
                .map(key => [key, report.audits[key]?.displayValue ?? 'n/a'])
            );
            console.log(JSON.stringify({ device, scores, metrics }, null, 2));
          }
          NODE

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esquina-mix-quality-audit
          path: artifacts/
          if-no-files-found: warn
